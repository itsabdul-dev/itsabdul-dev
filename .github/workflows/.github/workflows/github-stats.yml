name: GitHub Stats

on:
  schedule:
    # Runs once a day at 03:00 UTC — edit the cron if you want a different time
    - cron: "0 3 * * *"
  workflow_dispatch:  # lets you trigger it manually from the Actions tab
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate stats images
        uses: jstrieb/github-stats@master
        with:
          username: itsabdul-dev
          exclude_repos:
          exclude_langs:
          github_token: ${{ secrets.GITHUB_TOKEN }}
